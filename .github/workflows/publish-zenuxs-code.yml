name: Publish Zenuxs Code

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "npm dist-tag to publish"
        default: "latest"
        required: true
      dry_run:
        description: "Preview packages without publishing"
        default: "true"
        required: true
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release packages
        env:
          ZENUXS_SKIP_HUB_WEBVIEW_BUILD: "1"
        run: bun run --cwd apps/cli build:platforms

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            bun run --cwd apps/cli publish:npm:dry --tag "${{ inputs.npm_tag }}"
          else
            bun run --cwd apps/cli publish:npm --tag "${{ inputs.npm_tag }}"
          fi
